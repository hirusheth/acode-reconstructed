name: Build Android APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Build & Sign Reconstructed APK
        run: |
          chmod +x ./scripts/build-apk.sh
          ./scripts/build-apk.sh

      - name: Upload Signed APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: acode-reconstructed-v1.13.2-debug-apk
          path: |
            dist/acode-reconstructed-v1.13.2-debug.apk
            dist/acode-reconstructed-v1.13.2-debug.apk.sha256
          retention-days: 30
